# Dependabot config (node-library profile — npm + github-actions, no docker).
# Provisioned from project-baseline. One npm entry at the root covers every workspace
# because this is an npm-workspaces monorepo with a single root lockfile.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: ":dependabot: github-actions"
      include: "scope"
    groups:
      all-github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: ":dependabot: npm"
      include: "scope"
    groups:
      all-npm:
        patterns:
          - "*"
